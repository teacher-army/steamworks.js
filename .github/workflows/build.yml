#    needs: [build-windows, build-linux, build-mac]
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: binaries-linux
          path: dist
